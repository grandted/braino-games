<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG, not the SVG: iOS ignores an SVG apple-touch-icon and falls back
         to a screenshot of the page, which looks like nothing at all. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover so safe-area insets work on notched phones.
         maximum-scale/user-scalable: this is a game laid out to fill the
         screen exactly, and a pinch mid-round costs a round. Android honours
         these; iOS has ignored them since iOS 10, so Safari is handled in
         platform/zoom.ts instead — see the note there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta property="og:title" content="Braino Games" />
    <meta property="og:description" content="Small games for a sharp head." />
    <meta property="og:url" content="https://braino.games" />
    <!-- Standalone launch. The apple- prefixed one is deprecated and still
         the only one iOS reads; the bare one is what everything else reads. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Braino" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Small games for a sharp head. Pick a card and play. braino.games"
    />
    <title>Braino Games</title>
